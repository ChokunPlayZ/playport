<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0b0d12" />
    <title>PlayPort</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <div id="app">
      <header id="header">
        <div id="status">
          <span id="status-dot" data-state="idle"></span>
          <span id="status-text">Connecting…</span>
          <span id="stream-info"></span>
          <span id="mic-status"></span>
        </div>
        <div id="toolbar">
          <button id="btn-home" title="CarPlay home">Home</button>
          <button id="btn-back" title="Back">Back</button>
          <button id="btn-select" title="Select">Select</button>
          <button id="btn-prev" title="Previous track">⏮</button>
          <button id="btn-play" title="Play / pause">⏯</button>
          <button id="btn-next" title="Next track">⏭</button>
          <button id="btn-siri" title="Siri">Siri</button>
          <button id="btn-answer" title="Answer / end call">Call</button>
          <button id="btn-call-mute" title="Mute call">Mute call</button>
          <button id="btn-night" title="Day / night mode">Night</button>
          <button id="btn-audio" title="Volume mixer">Audio</button>
          <button id="btn-keyframe" title="Request a keyframe">Fix video</button>
          <button id="btn-display" title="Resolution, orientation and CarPlay UI size">Display</button>
          <button id="btn-mute" title="Mute audio">Mute</button>
          <button id="btn-fullscreen" title="Fullscreen">⛶</button>
        </div>
      </header>
      <main id="screen-container">
        <div id="surface">
          <canvas id="screen" width="1280" height="720"></canvas>
          <div id="overlay">
            <p id="overlay-text">Waiting for CarPlay…</p>
            <p class="hint">Touch/click to control. Keyboard: arrows = knob, Enter = select, Esc = back, S = Siri, Space = play/pause.</p>
          </div>
        </div>
      </main>
      <div id="audio-panel" class="hidden">
        <h3>Audio</h3>
        <div class="panel-row">
          <label for="audio-master">Master</label>
          <input id="audio-master" type="range" min="0" max="100" value="100" />
        </div>
        <div id="audio-streams"></div>
        <p id="audio-status" class="panel-hint">Streams appear here while CarPlay is playing audio.</p>
        <div class="panel-actions">
          <button id="btn-audio-close">Close</button>
        </div>
      </div>
      <div id="display-panel" class="hidden">
        <h3>Display</h3>
        <p class="panel-hint">Applying restarts CarPlay; the iPhone reconnects in a few seconds.</p>
        <div id="display-presets" class="preset-grid"></div>
        <div class="panel-row">
          <label for="display-codec">Video codec</label>
          <select id="display-codec">
            <option value="h264">H.264 (most compatible)</option>
            <option value="h265">H.265 / HEVC (sharper)</option>
          </select>
        </div>
        <div class="panel-row">
          <label for="display-fps">Frame rate</label>
          <select id="display-fps">
            <option value="60">60 fps</option>
            <option value="30">30 fps</option>
          </select>
        </div>
        <div class="panel-row">
          <label for="display-uiscale">CarPlay UI size</label>
          <select id="display-uiscale">
            <option value="75">Smaller</option>
            <option value="85">Small</option>
            <option value="100" selected>Default</option>
            <option value="115">Large</option>
          </select>
        </div>
        <div class="panel-row">
          <label>Custom</label>
          <input id="display-width" type="number" min="480" max="3840" step="2" placeholder="width" />
          <span>×</span>
          <input id="display-height" type="number" min="480" max="3840" step="2" placeholder="height" />
        </div>
        <div class="panel-actions">
          <button id="btn-display-apply">Apply</button>
          <button id="btn-display-match" title="Advertise this window's physical pixels so the canvas maps 1:1">Match this window</button>
          <button id="btn-display-close">Close</button>
        </div>
        <p id="display-status" class="panel-hint"></p>
      </div>
      <div id="error-banner" class="hidden"></div>
    </div>
    <script type="module" src="./src/main.ts"></script>
  </body>
</html>
